# Runs the FUSE dapp in hardhat and executes the e2e tests
#
name: '[execute] Execute fuse tests'
run-name: Run the fuse tests (${{ github.event_name }})
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch of the market repo to run against'
        required: true
        default: develop

jobs:
  test-run:
    runs-on: [self-hosted, Linux, X64, ten-test-azure-runner-01]
    steps:
      - name: 'Remove the market repo'
        run:
          rm -rf ${{ github.workspace }}/market

      - name: 'Check out the ten-test repo'
        uses: actions/checkout@v3
        with:
          path: ./ten-test

      - name: 'Check out the market repo'
        run: |
          git clone git@github-market:ten-protocol/market.git ${{ github.workspace }}/market
          cd ${{ github.workspace }}/market
          git checkout ${{ github.event.inputs.target_branch }}

      - name: 'Start up hardhat and deploy the FUSE dapp'
        env:
          USE_AAVE_VAULT: "false"
          HARDHAT_FORK_ENABLED: "false"
        run: |
          cd ${{ github.workspace }}/market
          yarn install
          nohup yarn chain > chain.log 2>&1 &
          sleep 30
          yarn deploy --network localhost

      - name: 'Build required artifacts for running tests'
        run: |
          cd ${{ github.workspace }}/ten-test
          ./get_artifacts.sh

      - name: 'Run tests'
        run: |
          cd ${{ github.workspace }}/ten-test/tests/dapps/market
          /usr/local/bin/pysys.py run -m hardhat 

      - name: 'Upload testcase output'
        uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: fuse-artifact
          path: |
            ${{ github.workspace }}/ten-test/**/Output
            ${{ github.workspace }}/market/chain.log
          retention-days: 1

      - name: 'Stop the hardhat chain'
        if: always()
        run: |
          kill -9 $(ps aux | grep "yarn chain" | grep -v grep | awk '{print $2}')

