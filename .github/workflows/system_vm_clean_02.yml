# Perform clean up on ten-test-google-runner-02
#
name: '[system] Clean google-runner-02'
run-name: Cleaning ten-test-google-runner-02 (${{ github.event_name }})
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-check:
    runs-on: [self-hosted, Linux, X64, ten-test-google-runner-02]
    steps:
      - name: 'Clean the docker folder'
        run: |
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker/
          sudo systemctl start docker

