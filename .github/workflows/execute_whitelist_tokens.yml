# Whitelist the USDC and USDT tokens
#
name: '[execute] Execute whitelist tokens'
run-name: Run remote tests (${{ github.event_name }} ${{ github.event.inputs.environment }} )
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        required: true
        default: ten.uat
        options:
          - ten.uat
          - ten.sepolia

jobs:
  test-run:
    runs-on: [self-hosted, Linux, X64, ten-test-azure-runner-01]
    steps:
      - name: 'Check out ten-test'
        uses: actions/checkout@v3
        with:
          path: ./ten-test

      - name: 'Check out go-ten code'
        uses: actions/checkout@v3
        with:
          repository: ten-protocol/go-ten
          path: ./go-ten

      - name: 'Build required artifacts for running tests'
        run: |
          cd ${{ github.workspace }}/ten-test
          ./get_artifacts.sh
          ls -l ${{ github.workspace }}/ten-test/artifacts   

      - name: 'Run whitelist'
        run: |
          cd ${{ github.workspace }}/ten-test/tests/network
          /usr/local/bin/pysys.py run -m ${{ github.event.inputs.environment }} whitelist_tokens



